name: weixin
on:
  workflow_dispatch:
  schedule: 
    # 代表北京时间早上7.30点运行
    - cron: '30 23 * * *'
jobs:
#将工作流程中运行的所有作业组合在一起
  build:
  #定义名为 build 的作业。 子键将定义作业的属性 
    runs-on: ubuntu-latest 
    steps:
      - uses: actions/checkout@v2
    
      - name: Set up Python 3.11
        uses: actions/setup-python@v2
        with:
          python-version: 3.11.0
      - name: Set timezone
        run: |
          cp /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
      - name: install pip packages
        run: |
          python -m pip install --upgrade pip
          pip3 install -r requirements.txt
      - name: weixin
        env:
          # 和风天气 API Key，必须在仓库 Settings → Secrets and variables → Actions 里添加。
          # 缺少这一行，main.py 里 os.getenv("QW_KEY") 就是 None，天气必然推送失败。
          QW_KEY: ${{ secrets.QW_KEY }}
          # 下面两个可选：不想把密钥明文写进 config.json 时，同样改用 Secrets 注入
          APP_SECRET: ${{ secrets.APP_SECRET }}
          TIANXING_API: ${{ secrets.TIANXING_API }}
        run: |
          python3 main.py
